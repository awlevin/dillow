name: CI

# `pull_request` (not `pull_request_target`): fork PRs run with a read-only
# token and no repository secrets, so untrusted code never sees credentials.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The real dataset is listing content and the answer key; it lives in
      # private storage. Only the fake sample may ever be tracked.
      - name: No real data committed
        run: |
          leaked=$(git ls-files src/data | grep -v '^src/data/sample/' || true)
          if [ -n "$leaked" ]; then echo "::error::Real data is tracked: $leaked"; exit 1; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
